
name: Publish Allure Report

on:
  workflow_run:
    workflows:
      - Qase Automated Tests
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID of Qase Automated Tests (for example 40500902211)"
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}

jobs:
  allure-report:
    name: Generate Allure HTML
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download test results from the original run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: '*results*'
          path: downloaded-results

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Allure Commandline
        run: |
          npm install --global allure-commandline@2.36.0
          allure --version

      - name: Generate separate API and browser reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p allure-site

          for entry in \
            'api-test-results|api|API' \
            'ui-results-chrome|ui/chrome|Chrome' \
            'ui-results-firefox|ui/firefox|Firefox' \
            'ui-results-edge|ui/edge|Edge'; do

            IFS='|' read -r artifact target browser <<< "$entry"
            results_dir="$(find "downloaded-results/$artifact" -type d -name allure-results -print -quit 2>/dev/null || true)"

            if [[ -z "$results_dir" ]]; then
              echo "::warning::Allure results not found for $artifact"
              mkdir -p "allure-site/$target"
              printf '<!doctype html><html><meta charset="utf-8"><title>No results</title><body><h1>No Allure results for %s</h1><p>Check the original workflow artifacts.</p><a href="../../index.html">Back to reports</a></body></html>\n' "$browser" > "allure-site/$target/index.html"
              continue
            fi

            printf 'Browser=%s\nEnvironment=GitHub Actions\nOS=Windows\n' "$browser" > "$results_dir/environment.properties"

            cat > "$results_dir/executor.json" <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildName": "Qase run ${SOURCE_RUN_ID}",
            "buildUrl": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}"
          }
          EOF

            allure generate "$results_dir" --clean --output "allure-site/$target"
          done

          cat > allure-site/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Qase Automated Tests — Allure Reports</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 760px; margin: 4rem auto; padding: 0 1.5rem; line-height: 1.5; }
              h1 { margin-bottom: .25rem; }
              .sub { color: #555; margin-bottom: 2rem; }
              .reports { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1rem; }
              .reports a { display: block; padding: 1.25rem; border: 1px solid #ddd; border-radius: 10px; text-decoration: none; color: #222; font-weight: 600; }
              .reports a:hover { border-color: #666; background: #f7f7f7; }
              footer { margin-top: 2rem; }
            </style>
          </head>
          <body>
            <h1>Qase Automated Tests</h1>
            <p class="sub">Allure reports for GitHub Actions run #${SOURCE_RUN_ID}</p>
            <div class="reports">
              <a href="api/">API tests</a>
              <a href="ui/chrome/">UI · Chrome</a>
              <a href="ui/firefox/">UI · Firefox</a>
              <a href="ui/edge/">UI · Edge</a>
            </div>
            <footer><a href="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}">View original workflow run</a></footer>
          </body>
          </html>
          EOF

      - name: Upload HTML report artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report-${{ env.SOURCE_RUN_ID }}
          path: allure-site/
          retention-days: 30
          if-no-files-found: error

  publish-pages:
    name: Publish Allure to GitHub Pages
    needs: allure-report
    if: ${{ github.event.repository.has_pages == true }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download generated HTML report
        uses: actions/download-artifact@v4
        with:
          name: allure-html-report-${{ env.SOURCE_RUN_ID }}
          path: allure-site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
